name: conv-mod-iso
version: 0.1.0.0
github: "wasabi315/conv-mod-iso"
license: MIT
author: "Satoshi Takimoto"
maintainer: "wasabi.nvim.st@gmail.com"
copyright: "2026 Satoshi Takimoto"
category: "Language"
description: "Please see the README on GitHub at <https://github.com/githubuser/conv-mod-iso#readme>"

language: GHC2021

flags:
  dump:
    description: dump core
    default: false
    manual: true
  llvm:
    description: use llvm for codegen
    default: false
    manual: true

dependencies:
  - base >= 4.7 && < 5
  - bytestring
  - containers
  - deepseq
  - flat
  - microlens-platform
  - generic-lens
  - parallel
  - primitive
  - skew-list
  - time

default-extensions:
  - BlockArguments
  - DeriveAnyClass
  - DerivingStrategies
  - DerivingVia
  - LambdaCase
  - MagicHash
  - NoFieldSelectors
  - OrPatterns
  - OverloadedStrings
  - OverloadedRecordDot
  - OverloadedLabels
  - PatternSynonyms
  - RecordWildCards
  - Strict
  - UnboxedTuples
  - ViewPatterns

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wno-name-shadowing
  - -O2

when:
  - condition: flag(dump)
    ghc-options:
      - -ddump-simpl
      - -dsuppress-all
      - -dno-suppress-type-signatures
      - -ddump-to-file
      - -dppr-cols=300
  - condition: flag(llvm)
    ghc-options:
      - -fllvm

library:
  source-dirs: src

executables:
  conv-mod-iso:
    source-dirs: app
    main: Main.hs
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts= "-N -A32M"
    dependencies:
      - conv-mod-iso

tests:
  conv-mod-iso-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts= "-A64M -s -N4"
    dependencies:
      - conv-mod-iso

benchmarks:
  conv-mod-iso-bench:
    main: Main.hs
    source-dirs: bench
    ghc-options:
      - -rtsopts
      - -with-rtsopts= "-N -A32M"
    dependencies:
      - conv-mod-iso
      - tasty
      - tasty-bench
    when:
      condition: "impl(ghc >= 8.6)"
      ghc-options:
        - -fproc-alignment=64
